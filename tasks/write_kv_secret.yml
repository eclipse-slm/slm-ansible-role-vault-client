### Inputs
- name: "Assert inputs of 'vault/client | write_kv_secret.yml'"
  ansible.builtin.assert:
    that:
      - (vault.url.internal is defined) and (vault.url.internal|length > 0)
      - (_vault_token is defined) and (_vault_token|length > 0)
      - (_kv_secret_engine_name is defined) and (_kv_secret_engine_name|length > 0)
      - (_kv_secret_engine_path is defined) and (_kv_secret_engine_path|length > 0)
      - (_kv_secret_engine_data is defined) and (_kv_secret_engine_data|length > 0)
    fail_msg: "Variable must be defined and not empty"

- name: "Write KV secret to '{{ _kv_secret_engine_name }}'"
  ansible.builtin.uri:
    url: "{{ vault.url.internal }}/v1/{{ _kv_secret_engine_name }}/data/{{_kv_secret_engine_path}}"
    validate_certs: false
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data: "{{ _kv_secret_engine_data }}"
    status_code: 204, 400
  register: output_write_kv_secret
  changed_when: output_write_kv_secret.status == 204
