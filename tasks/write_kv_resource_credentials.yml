---
### Inputs
- name: "Assert inputs of 'vault/client | write_kv_resource_credentials.yml'"
  ansible.builtin.assert:
    that:
      - (vault.url.internal is defined) and (vault.url.internal|length > 0)
      - (_vault_token is defined) and (_vault_token|length > 0)
      - (_resource_remote_access_service_id is defined) and (_resource_remote_access_service_id|length > 0)
      - (_resource_username is defined) and (_resource_username|length > 0)
      - (_resource_password is defined) and (_resource_password|length > 0)
    fail_msg: "Variable must be defined and not empty"

### Optional Inputs
# - _resource_cedential_data_type: Optional custom metadata for the KV secret engine. Default is USERNAME_PASSWORD.

- name: Validate '_resource_cedential_data_type' input
  when: (_resource_cedential_data_type is defined) and (_resource_cedential_data_type|length > 0)
  ansible.builtin.assert:
    that:
      - (_resource_cedential_data_type in credential_data_type_list)
    fail_msg: "Variable must be one of the following values: {{ credential_data_type_list | join(', ') }}"

- name: "Assure KV secret engine is created and write credentials of '{{ _resource_remote_access_service_id }}' to '{{ _kv_secret_engine_name }}'"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/{{ item }}.yml"
  vars:
    _kv_secret_engine_name: "resources"
    _kv_secret_engine_description: "resources secret engine"
    _kv_secret_engine_version: "{{ _kv_secret_engine_version | default('2') }}"
    _kv_secret_engine_path: "{{ _resource_remote_access_service_id }}/CredentialUsernamePassword"
    _kv_secret_engine_data:
      username: "{{ _resource_username }}"
      password: "{{ _resource_password }}"
  loop:
    - "create_kv_secret_engine"
    - "write_kv_secret"

- name: "Assure KV secret engine is created and write credentials to credentials path"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/{{ item }}.yml"
  vars:
    _kv_secret_engine_name: "credentials"
    _kv_secret_engine_description: "credentials secret engine"
    _kv_secret_engine_version: "{{ _kv_secret_engine_version | default('2') }}"
    _kv_secret_engine_path: "{{ _resource_remote_access_service_id }}"
    _kv_secret_engine_data:
      username: "{{ _resource_username }}"
      password: "{{ _resource_password }}"
    _kv_custom_metadata:
      credentialDataType: "{{ _resource_cedential_data_type | default(credential_data_type_default) }}"
  loop:
    - "create_kv_secret_engine"
    - "write_kv_secret"

### Outputs:
- name: Set Outputs
  ansible.builtin.set_fact:
    vault_kv_credential_id: "{{ _resource_remote_access_service_id }}"
